  <script type="text/babel" data-presets="env,react">
    (() => {
      if (!window.React || !window.ReactDOM) {
        return;
      }

      class LimiteDeError extends React.Component {
        constructor(props) {
          super(props);
          this.state = { haFallado: false };
        }

        static getDerivedStateFromError() {
          return { haFallado: true };
        }

        componentDidCatch(error) {
          console.error("Fallo en un bloque interactivo:", error);
          this.props.alFallar();
        }

        render() {
          return this.state.haFallado ? null : this.props.children;
        }
      }
      function MatematicaEnLinea({ tex }) {
        if (!window.katex) {
          return <span>{tex}</span>;
        }

        return (
          <span
            dangerouslySetInnerHTML={{
              __html: window.katex.renderToString(tex, {
                displayMode: false,
                output: "htmlAndMathml",
                strict: "ignore",
                throwOnError: false
              })
            }}
          />
        );
      }

      function FormulaViva({ tex }) {
        if (!window.katex) {
          return <p className="formula-viva">{tex}</p>;
        }

        return (
          <p
            className="formula-viva"
            dangerouslySetInnerHTML={{
              __html: window.katex.renderToString(tex, {
                displayMode: true,
                output: "htmlAndMathml",
                strict: "ignore",
                throwOnError: false
              })
            }}
          />
        );
      }
      function monomioTex(coeficiente, grado, esPrimero) {
        if (coeficiente === 0) {
          return "";
        }
        const signo = coeficiente < 0 ? "-" : esPrimero ? "" : "+";
        const absoluto = Math.abs(coeficiente);
        const numero = absoluto === 1 && grado > 0 ? "" : String(absoluto);
        const parte =
          grado === 0 ? "" : grado === 1 ? "x" : "x^" + grado;
        return signo + numero + parte;
      }

      function filaEcuacionCeldasTex(fila) {
        const letras = ["x", "y", "z"];
        const celdas = [];
        let primera = true;
        for (let i = 0; i < 3; i += 1) {
          if (fila[i] === 0) {
            celdas.push("");
            continue;
          }
          const termino = monomioTex(fila[i], 1, primera).replace(
            "x",
            letras[i]
          );
          celdas.push(primera ? termino : "{}" + termino);
          primera = false;
        }
        if (primera) {
          celdas[2] = "0";
        }
        celdas.push("=" + fila[3]);
        return celdas.join(" & ");
      }
      const OG_LADO = 5;
      const OG_ESQUINAS = (() => {
        const lista = [];
        [-OG_LADO, OG_LADO].forEach((x) =>
          [-OG_LADO, OG_LADO].forEach((y) =>
            [-OG_LADO, OG_LADO].forEach((z) => lista.push([x, y, z]))
          )
        );
        return lista;
      })();
      const OG_ARISTAS = (() => {
        const pares = [];
        for (let i = 0; i < 8; i += 1) {
          for (let j = i + 1; j < 8; j += 1) {
            let distintas = 0;
            for (let k = 0; k < 3; k += 1) {
              if (OG_ESQUINAS[i][k] !== OG_ESQUINAS[j][k]) {
                distintas += 1;
              }
            }
            if (distintas === 1) {
              pares.push([OG_ESQUINAS[i], OG_ESQUINAS[j]]);
            }
          }
        }
        return pares;
      })();

      function ogEvaluarPlano(plano, punto) {
        return (
          plano[0] * punto[0] +
          plano[1] * punto[1] +
          plano[2] * punto[2] -
          plano[3]
        );
      }

      function ogPoligonoPlano(plano) {
        const norma =
          Math.abs(plano[0]) + Math.abs(plano[1]) + Math.abs(plano[2]);
        if (norma < 1e-9) {
          return null;
        }
        const puntos = [];
        OG_ARISTAS.forEach((arista) => {
          const f1 = ogEvaluarPlano(plano, arista[0]);
          const f2 = ogEvaluarPlano(plano, arista[1]);
          if (f1 === 0 && f2 === 0) {
            return;
          }
          if (f1 * f2 > 0) {
            return;
          }
          const t = f1 / (f1 - f2);
          if (t < -1e-9 || t > 1 + 1e-9) {
            return;
          }
          const punto = [0, 1, 2].map(
            (k) => arista[0][k] + t * (arista[1][k] - arista[0][k])
          );
          if (
            !puntos.some(
              (previo) =>
                Math.abs(previo[0] - punto[0]) < 1e-6 &&
                Math.abs(previo[1] - punto[1]) < 1e-6 &&
                Math.abs(previo[2] - punto[2]) < 1e-6
            )
          ) {
            puntos.push(punto);
          }
        });
        if (puntos.length < 3) {
          return null;
        }
        const normal = [plano[0], plano[1], plano[2]];
        const eje =
          Math.abs(normal[0]) <= Math.abs(normal[1]) &&
          Math.abs(normal[0]) <= Math.abs(normal[2])
            ? [1, 0, 0]
            : Math.abs(normal[1]) <= Math.abs(normal[2])
              ? [0, 1, 0]
              : [0, 0, 1];
        const u = [
          normal[1] * eje[2] - normal[2] * eje[1],
          normal[2] * eje[0] - normal[0] * eje[2],
          normal[0] * eje[1] - normal[1] * eje[0]
        ];
        const v = [
          normal[1] * u[2] - normal[2] * u[1],
          normal[2] * u[0] - normal[0] * u[2],
          normal[0] * u[1] - normal[1] * u[0]
        ];
        const centro = [0, 1, 2].map(
          (k) =>
            puntos.reduce((suma, p) => suma + p[k], 0) / puntos.length
        );
        const angulo = (p) => {
          const d = [0, 1, 2].map((k) => p[k] - centro[k]);
          const cu = d[0] * u[0] + d[1] * u[1] + d[2] * u[2];
          const cv = d[0] * v[0] + d[1] * v[1] + d[2] * v[2];
          return Math.atan2(cv, cu);
        };
        return puntos
          .map((p) => ({ p, a: angulo(p) }))
          .sort((m, n) => m.a - n.a)
          .map((dato) => dato.p);
      }

      function ogRectaDeDosPlanos(plano1, plano2) {
        const n1 = plano1;
        const n2 = plano2;
        const direccion = [
          n1[1] * n2[2] - n1[2] * n2[1],
          n1[2] * n2[0] - n1[0] * n2[2],
          n1[0] * n2[1] - n1[1] * n2[0]
        ];
        const mayor = [0, 1, 2].reduce(
          (m, k) =>
            Math.abs(direccion[k]) > Math.abs(direccion[m]) ? k : m,
          0
        );
        if (Math.abs(direccion[mayor]) < 1e-9) {
          return null;
        }
        const ejes = [0, 1, 2].filter((k) => k !== mayor);
        const a11 = plano1[ejes[0]];
        const a12 = plano1[ejes[1]];
        const a21 = plano2[ejes[0]];
        const a22 = plano2[ejes[1]];
        const det = a11 * a22 - a12 * a21;
        if (Math.abs(det) < 1e-9) {
          return null;
        }
        const punto = [0, 0, 0];
        punto[ejes[0]] = (plano1[3] * a22 - plano2[3] * a12) / det;
        punto[ejes[1]] = (plano2[3] * a11 - plano1[3] * a21) / det;
        let tMin = -Infinity;
        let tMax = Infinity;
        for (let k = 0; k < 3; k += 1) {
          if (Math.abs(direccion[k]) < 1e-9) {
            if (Math.abs(punto[k]) > OG_LADO) {
              return null;
            }
            continue;
          }
          const t1 = (-OG_LADO - punto[k]) / direccion[k];
          const t2 = (OG_LADO - punto[k]) / direccion[k];
          tMin = Math.max(tMin, Math.min(t1, t2));
          tMax = Math.min(tMax, Math.max(t1, t2));
        }
        if (tMin > tMax) {
          return null;
        }
        const extremo = (t) =>
          [0, 1, 2].map((k) => punto[k] + t * direccion[k]);
        return [extremo(tMin), extremo(tMax)];
      }

      function ogProyector(azimut, elevacion) {
        const cosA = Math.cos(azimut);
        const sinA = Math.sin(azimut);
        const cosE = Math.cos(elevacion);
        const sinE = Math.sin(elevacion);
        const FOCO = 26;
        const ESCALA = 30;
        return (p) => {
          const xr = p[0] * cosA - p[1] * sinA;
          const yr = p[0] * sinA + p[1] * cosA;
          const zr = p[2] * cosE - yr * sinE;
          const profundidad = yr * cosE + p[2] * sinE;
          const factor = FOCO / (FOCO - profundidad);
          return {
            x: 320 + xr * factor * ESCALA,
            y: 250 - zr * factor * ESCALA,
            profundidad
          };
        };
      }

      const OG_NIVELES = [
        {
          nombre: "Misión 1: el punto",
          tipo: "scd",
          filas: [
            [1, 1, 1, 2],
            [2, -1, 3, 13],
            [1, 2, -1, -6]
          ],
          solucion: [1, -2, 3]
        },
        {
          nombre: "Misión 2: la confirmación",
          tipo: "scd",
          filas: [
            [1, 1, 1, 2],
            [2, -1, 3, 0],
            [1, 2, -2, 6]
          ],
          solucion: [2, 1, -1]
        },
        {
          nombre: "Misión 3: el haz",
          tipo: "sci",
          filas: [
            [1, 1, -1, 1],
            [2, 3, -2, 3],
            [3, 4, -3, 4]
          ]
        },
        {
          nombre: "Misión 4: el imposible",
          tipo: "si",
          filas: [
            [1, 1, 1, 1],
            [2, 2, 2, 3],
            [1, -1, 1, 0]
          ]
        }
      ];

      const OG_COLORES = ["#60a5fa", "#fb923c", "#4ade80"];

      function OrbitaGaussInteractivo({ configuracion, alPreparar }) {
        const reducida =
          typeof window.matchMedia === "function" &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const [nivelId, setNivelId] = React.useState(0);
        const [filas, setFilas] = React.useState(OG_NIVELES[0].filas);
        const [pasos, setPasos] = React.useState(0);
        const [azimut, setAzimut] = React.useState(0.65);
        const [elevacion, setElevacion] = React.useState(0.42);
        const [objetivo, setObjetivo] = React.useState(1);
        const [propio, setPropio] = React.useState(1);
        const [ajeno, setAjeno] = React.useState(-2);
        const [fuente, setFuente] = React.useState(0);
        const [animacion, setAnimacion] = React.useState(null);
        const [fase, setFase] = React.useState("escalona");
        const [veredictoClase, setVeredictoClase] = React.useState(null);
        const [entradas, setEntradas] = React.useState({
          x: "",
          y: "",
          z: ""
        });
        const [errorPunto, setErrorPunto] = React.useState(false);
        const [orbita, setOrbita] = React.useState(false);
        const [intentosClase, setIntentosClase] = React.useState(0);
        const [intentosPunto, setIntentosPunto] = React.useState(0);
        const arrastre = React.useRef(null);
        const audioRef = React.useRef(null);
        const panelRef = React.useRef(null);

        React.useEffect(() => {
          if (window.katex) {
            alPreparar();
          }
        }, [alPreparar]);

        React.useEffect(() => {
          if (!animacion) {
            return undefined;
          }
          let vivo = true;
          const arranque = performance.now();
          const paso = (ahora) => {
            if (!vivo) {
              return;
            }
            const t = Math.min((ahora - arranque) / 650, 1);
            setAnimacion((estado) =>
              estado ? { ...estado, t } : estado
            );
            if (t < 1) {
              requestAnimationFrame(paso);
            } else {
              setAnimacion(null);
            }
          };
          requestAnimationFrame(paso);
          // En pestañas ocultas requestAnimationFrame se pausa: este
          // temporizador garantiza que la animación termina igualmente.
          const temporizador = window.setTimeout(() => {
            if (vivo) {
              setAnimacion(null);
            }
          }, 750);
          return () => {
            vivo = false;
            window.clearTimeout(temporizador);
          };
        }, [animacion === null ? null : animacion.marca]);

        React.useEffect(() => {
          if (!orbita || reducida) {
            return undefined;
          }
          let vivo = true;
          const girar = () => {
            if (!vivo) {
              return;
            }
            setAzimut((valor) => valor + 0.004);
            requestAnimationFrame(girar);
          };
          requestAnimationFrame(girar);
          return () => {
            vivo = false;
          };
        }, [orbita, reducida]);

        React.useEffect(() => {
          if (fase !== "escalona" && panelRef.current) {
            panelRef.current.focus();
          }
        }, [fase]);

        if (!window.katex) {
          return null;
        }

        const nivel = OG_NIVELES[nivelId];

        const sonido = (frecuencias, duracion) => {
          try {
            if (!audioRef.current) {
              const Contexto =
                window.AudioContext || window.webkitAudioContext;
              if (!Contexto) {
                return;
              }
              audioRef.current = new Contexto();
            }
            const ctx = audioRef.current;
            if (ctx.state === "suspended") {
              ctx.resume();
            }
            const ahora = ctx.currentTime;
            frecuencias.forEach((frecuencia) => {
              const osc = ctx.createOscillator();
              const ganancia = ctx.createGain();
              osc.type = "sine";
              osc.frequency.value = frecuencia;
              ganancia.gain.setValueAtTime(0.0001, ahora);
              ganancia.gain.exponentialRampToValueAtTime(
                0.06,
                ahora + 0.02
              );
              ganancia.gain.exponentialRampToValueAtTime(
                0.0001,
                ahora + duracion
              );
              osc.connect(ganancia).connect(ctx.destination);
              osc.start(ahora);
              osc.stop(ahora + duracion + 0.05);
            });
          } catch (error) {
            /* sin audio */
          }
        };

        const cargarNivel = (indice) => {
          setNivelId(indice);
          setFilas(OG_NIVELES[indice].filas);
          setPasos(0);
          setFase("escalona");
          setVeredictoClase(null);
          setEntradas({ x: "", y: "", z: "" });
          setErrorPunto(false);
          setAnimacion(null);
          setObjetivo(1);
          setPropio(1);
          setAjeno(-2);
          setFuente(0);
          setIntentosClase(0);
          setIntentosPunto(0);
        };

        const filaDegenerada = (fila) =>
          fila[0] === 0 && fila[1] === 0 && fila[2] === 0;

        // Variable líder de cada fila: 0, 1 o 2, o bien una fila
        // degenerada («sobrante» 0=0, «imposible» 0=k). El sistema está
        // escalonado, salvo el orden de las filas, cuando ninguna
        // variable líder se repite.
        const lideres = filas.map((fila) =>
          fila[0] !== 0
            ? 0
            : fila[1] !== 0
              ? 1
              : fila[2] !== 0
                ? 2
                : fila[3] !== 0
                  ? "imposible"
                  : "sobrante"
        );
        const lideresNumericos = lideres.filter(
          (valor) => typeof valor === "number"
        );
        const escalonado =
          new Set(lideresNumericos).size === lideresNumericos.length;
        const imposibleALaVista = lideres.includes("imposible");
        const puedeClasificar = escalonado || imposibleALaVista;

        const aplicar = () => {
          if (animacion || fase !== "escalona" || fuente === objetivo) {
            return;
          }
          const desde = filas[objetivo];
          const hasta = desde.map(
            (valor, k) => propio * valor + ajeno * filas[fuente][k]
          );
          const nuevas = filas.map((fila, indice) =>
            indice === objetivo ? hasta : fila
          );
          setFilas(nuevas);
          setPasos(pasos + 1);
          sonido([196 + 44 * objetivo], 0.25);
          if (!reducida) {
            setAnimacion({
              fila: objetivo,
              desde,
              hasta,
              bisagra: filas[fuente],
              t: 0,
              marca: pasos + 1
            });
          }
        };

        const clasificar = (eleccion) => {
          const acierto = eleccion === nivel.tipo;
          setVeredictoClase(eleccion);
          if (acierto) {
            sonido([392, 494], 0.5);
            setFase(nivel.tipo === "scd" ? "punto" : "superado");
          } else {
            sonido([147, 110], 0.35);
            setIntentosClase(intentosClase + 1);
          }
        };

        const comprobarPunto = () => {
          const leer = (texto) => {
            const limpio = String(texto).trim();
            if (limpio === "") {
              return NaN;
            }
            return Number(limpio.replace(",", "."));
          };
          const propuesto = [
            leer(entradas.x),
            leer(entradas.y),
            leer(entradas.z)
          ];
          const bien =
            propuesto.every((valor) => Number.isFinite(valor)) &&
            propuesto.every(
              (valor, k) => Math.abs(valor - nivel.solucion[k]) < 1e-9
            );
          if (bien) {
            setErrorPunto(false);
            setFase("superado");
            sonido([262, 330, 392, 523], 0.9);
            try {
              const clave = "orbita-gauss-nivel-" + nivelId;
              const previo = window.localStorage.getItem(clave);
              if (previo === null || pasos < Number(previo)) {
                window.localStorage.setItem(clave, String(pasos));
              }
            } catch (error) {
              /* sin memoria */
            }
          } else {
            sonido([147, 110], 0.35);
            setErrorPunto(true);
            setIntentosPunto(intentosPunto + 1);
          }
        };

        const leerRecord = () => {
          try {
            return window.localStorage.getItem(
              "orbita-gauss-nivel-" + nivelId
            );
          } catch (error) {
            return null;
          }
        };

        const proyectar = ogProyector(azimut, elevacion);

        const filasVisibles = filas.map((fila, indice) => {
          if (animacion && animacion.fila === indice) {
            const t =
              animacion.t < 0.5
                ? 2 * animacion.t * animacion.t
                : 1 - Math.pow(-2 * animacion.t + 2, 2) / 2;
            return animacion.desde.map(
              (valor, k) =>
                valor + t * (animacion.hasta[k] - valor)
            );
          }
          return fila;
        });

        const filasParaDibujar =
          fase === "superado" && nivel.tipo !== "scd"
            ? nivel.filas
            : filasVisibles;

        const capas = [];
        filasParaDibujar.forEach((fila, indice) => {
          if (filaDegenerada(fila)) {
            return;
          }
          const poligono = ogPoligonoPlano(fila);
          if (!poligono) {
            return;
          }
          const proyectado = poligono.map(proyectar);
          capas.push({
            indice,
            puntos: proyectado
              .map((p) => p.x.toFixed(1) + "," + p.y.toFixed(1))
              .join(" "),
            profundidad:
              proyectado.reduce(
                (suma, p) => suma + p.profundidad,
                0
              ) / proyectado.length
          });
        });
        capas.sort((m, n) => m.profundidad - n.profundidad);

        let bisagra = null;
        if (animacion) {
          const recta = ogRectaDeDosPlanos(
            filasVisibles[animacion.fila],
            animacion.bisagra
          );
          if (recta) {
            bisagra = recta.map(proyectar);
          }
        }

        let rectaComun = null;
        if (fase === "superado" && nivel.tipo === "sci") {
          const recta = ogRectaDeDosPlanos(
            nivel.filas[0],
            nivel.filas[1]
          );
          if (recta) {
            rectaComun = recta.map(proyectar);
          }
        }

        const puntoSolucion =
          fase === "superado" && nivel.tipo === "scd"
            ? proyectar(nivel.solucion)
            : null;

        const sistemaTex =
          "\\left\\{\\begin{array}{rrrl}" +
          filas.map(filaEcuacionCeldasTex).join("\\\\") +
          "\\end{array}\\right.";

        const hayImposible = filas.some(
          (fila) => filaDegenerada(fila) && fila[3] !== 0
        );
        const haySobrante = filas.some(
          (fila) => filaDegenerada(fila) && fila[3] === 0
        );

        return (
          <div className="componente-interactivo">
            <p className="titulo-interactivo">
              {configuracion.titulo || "Órbita Gauss"}
            </p>
            <p className="instruccion-interactivo">
              Cada ecuación es un plano. Arrastra para orbitar la
              cámara, escalona el sistema con transformaciones
              elementales y observa cómo cada operación hace girar un
              plano sobre su bisagra: la recta donde corta al plano con
              el que se combina. Y si los dos planos son paralelos no
              hay bisagra: el plano se desliza sin girar, y puede
              desvanecerse en un imposible.
            </p>

            <div
              className="og-misiones"
              role="group"
              aria-label="Misiones"
            >
              {OG_NIVELES.map((dato, indice) => (
                <button
                  key={dato.nombre}
                  type="button"
                  className="chip-control"
                  aria-pressed={nivelId === indice}
                  style={
                    nivelId === indice
                      ? { borderColor: "#2563eb", color: "#2563eb" }
                      : undefined
                  }
                  onClick={() => cargarNivel(indice)}
                >
                  {dato.nombre}
                </button>
              ))}
            </div>

            <div className="og-lienzo">
              <svg
                viewBox="0 0 640 500"
                role="img"
                aria-label={
                  nivel.nombre +
                  ": sistema de tres planos en el espacio. " +
                  (fase === "superado"
                    ? nivel.tipo === "scd"
                      ? "Resuelto: los planos se cortan en un punto."
                      : nivel.tipo === "sci"
                        ? "Resuelto: los planos comparten una recta."
                        : "Resuelto: los planos no tienen punto común."
                    : "Pasos dados: " + pasos + ".")
                }
                onPointerDown={(evento) => {
                  arrastre.current = {
                    x: evento.clientX,
                    y: evento.clientY
                  };
                  evento.currentTarget.setPointerCapture(
                    evento.pointerId
                  );
                }}
                onPointerMove={(evento) => {
                  if (!arrastre.current) {
                    return;
                  }
                  const dx = evento.clientX - arrastre.current.x;
                  const dy = evento.clientY - arrastre.current.y;
                  arrastre.current = {
                    x: evento.clientX,
                    y: evento.clientY
                  };
                  setAzimut((valor) => valor + dx * 0.008);
                  setElevacion((valor) =>
                    Math.max(
                      -1.35,
                      Math.min(1.35, valor + dy * 0.008)
                    )
                  );
                }}
                onPointerUp={() => {
                  arrastre.current = null;
                }}
                onPointerCancel={() => {
                  arrastre.current = null;
                }}
              >
                {OG_ARISTAS.map((arista, indice) => {
                  const p1 = proyectar(arista[0]);
                  const p2 = proyectar(arista[1]);
                  return (
                    <line
                      key={"arista" + indice}
                      x1={p1.x}
                      y1={p1.y}
                      x2={p2.x}
                      y2={p2.y}
                      stroke="#31406b"
                      strokeWidth="1"
                    />
                  );
                })}
                {[
                  [[OG_LADO, 0, 0], "x"],
                  [[0, OG_LADO, 0], "y"],
                  [[0, 0, OG_LADO], "z"]
                ].map((eje) => {
                  const origen = proyectar([0, 0, 0]);
                  const punta = proyectar(eje[0]);
                  return (
                    <g key={"eje" + eje[1]}>
                      <line
                        x1={origen.x}
                        y1={origen.y}
                        x2={punta.x}
                        y2={punta.y}
                        stroke="#8ea3d8"
                        strokeWidth="1.4"
                        strokeDasharray="5 4"
                      />
                      <text
                        x={punta.x + 8}
                        y={punta.y}
                        fontSize="15"
                        fill="#8ea3d8"
                      >
                        {eje[1]}
                      </text>
                    </g>
                  );
                })}
                {capas.map((capa) => (
                  <polygon
                    key={"plano" + capa.indice}
                    points={capa.puntos}
                    fill={OG_COLORES[capa.indice]}
                    fillOpacity="0.33"
                    stroke={OG_COLORES[capa.indice]}
                    strokeWidth="2"
                    strokeLinejoin="round"
                  />
                ))}
                {bisagra && (
                  <line
                    x1={bisagra[0].x}
                    y1={bisagra[0].y}
                    x2={bisagra[1].x}
                    y2={bisagra[1].y}
                    stroke="#facc15"
                    strokeWidth="2.5"
                    strokeDasharray="7 5"
                  />
                )}
                {rectaComun && (
                  <g>
                    <line
                      className="og-halo"
                      x1={rectaComun[0].x}
                      y1={rectaComun[0].y}
                      x2={rectaComun[1].x}
                      y2={rectaComun[1].y}
                      stroke="#facc15"
                      strokeWidth="7"
                      strokeLinecap="round"
                      opacity="0.5"
                    />
                    <line
                      x1={rectaComun[0].x}
                      y1={rectaComun[0].y}
                      x2={rectaComun[1].x}
                      y2={rectaComun[1].y}
                      stroke="#fde68a"
                      strokeWidth="2.5"
                    />
                  </g>
                )}
                {puntoSolucion && (
                  <g>
                    <circle
                      className="og-halo"
                      cx={puntoSolucion.x}
                      cy={puntoSolucion.y}
                      r="16"
                      fill="#facc15"
                      opacity="0.4"
                    />
                    <circle
                      cx={puntoSolucion.x}
                      cy={puntoSolucion.y}
                      r="7"
                      fill="#fde68a"
                      stroke="#facc15"
                      strokeWidth="2"
                    />
                  </g>
                )}
              </svg>
            </div>

            <div
              className="og-camara"
              role="group"
              aria-label="Cámara"
            >
              <button
                type="button"
                onClick={() => setAzimut((valor) => valor - 0.25)}
              >
                ← Izquierda
              </button>
              <button
                type="button"
                onClick={() => setAzimut((valor) => valor + 0.25)}
              >
                Derecha →
              </button>
              <button
                type="button"
                onClick={() =>
                  setElevacion((valor) => Math.min(1.35, valor + 0.2))
                }
              >
                ↑ Subir
              </button>
              <button
                type="button"
                onClick={() =>
                  setElevacion((valor) => Math.max(-1.35, valor - 0.2))
                }
              >
                ↓ Bajar
              </button>
              {!reducida && (
                <button
                  type="button"
                  aria-pressed={orbita}
                  onClick={() => setOrbita(!orbita)}
                >
                  {orbita ? "Detener órbita" : "Órbita automática"}
                </button>
              )}
            </div>

            <FormulaViva tex={sistemaTex} />

            {fase === "escalona" && !puedeClasificar && (
              <div className="paso-interactivo">
                <span className="kicker-conjunto">
                  Transformación elemental
                </span>
                <div
                  className="opciones-interactivo"
                  role="group"
                  aria-label="Ecuación que se transforma"
                >
                  {[1, 2].map((indice) => (
                    <button
                      key={"objetivo" + indice}
                      type="button"
                      aria-pressed={objetivo === indice}
                      onClick={() => {
                        setObjetivo(indice);
                        if (fuente === indice) {
                          setFuente(0);
                        }
                      }}
                    >
                      {"Transformar E" + (indice + 1)}
                    </button>
                  ))}
                </div>
                <p>
                  <label>
                    {"Multiplico E" + (objetivo + 1) + " por "}
                    <select
                      value={propio}
                      onChange={(evento) =>
                        setPropio(Number(evento.target.value))
                      }
                    >
                      {[1, 2, 3, 4, -1, -2, -3, -4].map((valor) => (
                        <option key={"p" + valor} value={valor}>
                          {valor}
                        </option>
                      ))}
                    </select>
                  </label>{" "}
                  <label>
                    {" y le sumo "}
                    <select
                      value={ajeno}
                      onChange={(evento) =>
                        setAjeno(Number(evento.target.value))
                      }
                    >
                      {[-4, -3, -2, -1, 1, 2, 3, 4].map((valor) => (
                        <option key={"a" + valor} value={valor}>
                          {valor}
                        </option>
                      ))}
                    </select>
                  </label>{" "}
                  <label>
                    {" por "}
                    <select
                      value={fuente}
                      onChange={(evento) =>
                        setFuente(Number(evento.target.value))
                      }
                    >
                      {[0, 1, 2]
                        .filter((indice) => indice !== objetivo)
                        .map((indice) => (
                          <option key={"f" + indice} value={indice}>
                            {"E" + (indice + 1)}
                          </option>
                        ))}
                    </select>
                  </label>
                </p>
                <div className="opciones-interactivo">
                  <button type="button" onClick={aplicar}>
                    Aplicar y ver el giro
                  </button>
                  <button
                    type="button"
                    onClick={() => cargarNivel(nivelId)}
                  >
                    Reiniciar misión
                  </button>
                </div>
                <p className="nota-escala">
                  {"Pasos dados: " + pasos + "."}
                </p>
              </div>
            )}

            {nivelId === 0 && fase === "escalona" && pasos === 0 && (
              <p className="nota-escala">
                ¿Reconoces el sistema? Es el ejemplo de Gauss de la
                unidad, ahora con ojos geométricos.
              </p>
            )}

            {fase === "escalona" && puedeClasificar && (
              <div className="paso-interactivo">
                <span className="kicker-conjunto">
                  {(imposibleALaVista && !escalonado
                    ? "Contradicción a la vista en "
                    : "Escalonado en ") +
                    pasos +
                    (pasos === 1 ? " paso" : " pasos")}
                </span>
                <p>
                  {hayImposible
                    ? "Ha aparecido una fila imposible. Mira los " +
                      "planos y clasifica el sistema."
                    : haySobrante
                      ? "Una ecuación se ha desvanecido: era " +
                        "información repetida. Clasifica el sistema."
                      : "El triángulo está a la vista. Orbita la " +
                        "cámara y clasifica el sistema."}
                </p>
                <div
                  className="opciones-interactivo"
                  role="group"
                  aria-label="Clasificación del sistema"
                >
                  <button
                    type="button"
                    onClick={() => clasificar("scd")}
                  >
                    Compatible determinado
                  </button>
                  <button
                    type="button"
                    onClick={() => clasificar("sci")}
                  >
                    Compatible indeterminado
                  </button>
                  <button type="button" onClick={() => clasificar("si")}>
                    Incompatible
                  </button>
                  <button
                    type="button"
                    onClick={() => cargarNivel(nivelId)}
                  >
                    Reiniciar misión
                  </button>
                </div>
                {veredictoClase &&
                  veredictoClase !== nivel.tipo && (
                    <p className="nota-escala" aria-live="polite">
                      {(intentosClase > 1
                        ? "Intento " + intentosClase + ": esa"
                        : "Esa") +
                        " clasificación no encaja con lo que " +
                        "muestran los planos: vuelve a mirarlos."}
                    </p>
                  )}
              </div>
            )}

            {fase === "punto" && (
              <div
                className="paso-interactivo"
                ref={panelRef}
                tabIndex={-1}
              >
                <span className="kicker-conjunto">
                  Sustitución hacia atrás
                </span>
                <p>
                  Correcto: hay un único punto común. Despeja de abajo
                  arriba y escríbelo.
                </p>
                <p>
                  {["x", "y", "z"].map((letra) => (
                    <label key={letra} style={{ marginRight: "0.8rem" }}>
                      {letra + " = "}
                      <input
                        type="text"
                        inputMode="numeric"
                        size="4"
                        value={entradas[letra]}
                        onChange={(evento) =>
                          setEntradas({
                            ...entradas,
                            [letra]: evento.target.value
                          })
                        }
                      />
                    </label>
                  ))}
                </p>
                <div className="opciones-interactivo">
                  <button type="button" onClick={comprobarPunto}>
                    Encender el punto
                  </button>
                  <button
                    type="button"
                    onClick={() => cargarNivel(nivelId)}
                  >
                    Reiniciar misión
                  </button>
                </div>
                {errorPunto && (
                  <p className="nota-escala" aria-live="polite">
                    {(intentosPunto > 1
                      ? "Intento " + intentosPunto + ": ese"
                      : "Ese") +
                      " punto no cumple las tres ecuaciones: revisa " +
                      "la sustitución hacia atrás (y rellena las " +
                      "tres casillas)."}
                  </p>
                )}
              </div>
            )}

            {fase === "superado" && (
              <div
                className="veredicto-interactivo"
                aria-live="polite"
                ref={panelRef}
                tabIndex={-1}
              >
                <strong>
                  {nivel.tipo === "scd"
                    ? "¡Punto encendido en " + pasos + " pasos!"
                    : nivel.tipo === "sci"
                      ? "¡Recta común revelada!"
                      : "Misión cumplida: no había punto que buscar"}
                </strong>
                <p>
                  {nivel.tipo === "scd"
                    ? "Los tres planos se cortan exactamente en " +
                      "(" +
                      nivel.solucion.join(", ") +
                      "): sistema compatible determinado. Orbita la " +
                      "cámara alrededor del punto de luz." +
                      (leerRecord() !== null
                        ? " Tu mejor marca en esta misión: " +
                          leerRecord() +
                          " pasos."
                        : "")
                    : nivel.tipo === "sci"
                      ? "Los tres planos comparten una recta entera: " +
                        "compatible indeterminado, con una solución " +
                        "por cada punto de la recta iluminada."
                      : "Dos planos son paralelos: por mucho que el " +
                        "tercero los cruce, no existe ningún punto " +
                        "común a los tres. Sistema incompatible."}
                </p>
                {nivelId < OG_NIVELES.length - 1 ? (
                  <div className="opciones-interactivo">
                    <button
                      type="button"
                      onClick={() => cargarNivel(nivelId + 1)}
                    >
                      Siguiente misión
                    </button>
                  </div>
                ) : (
                  <p>
                    Has visto las tres geometrías de estas misiones:
                    el punto, la recta y el vacío, que es lo que la
                    clasificación SCD, SCI y SI resume con letras.
                    Tres planos pueden colocarse todavía de más
                    maneras (las estudiarás con detalle en 2.º), pero
                    todas desembocan en una de esas tres respuestas.
                  </p>
                )}
              </div>
            )}
          </div>
        );
      }

      const montaje = document.getElementById("og-montaje");
      const preparado = () =>
        document.body.classList.add("juego-listo");
      const fallo = () =>
        document.body.classList.remove("juego-listo");

      try {
        ReactDOM.createRoot(montaje).render(
          <LimiteDeError alFallar={fallo}>
            <OrbitaGaussInteractivo
              configuracion={{}}
              alPreparar={preparado}
            />
          </LimiteDeError>
        );
      } catch (error) {
        console.error("No se pudo montar el juego:", error);
        fallo();
      }
    })();
  </script>
</body>
</html>
