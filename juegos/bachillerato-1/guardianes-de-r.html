      function GrSprite({ dibujo, etiqueta, clase }) {
        const filas = dibujo.filas;
        const alto = filas.length;
        let ancho = 0;
        filas.forEach((fila) => {
          ancho = Math.max(ancho, fila.length);
        });
        return (
          <span className={"gr-sprite" + (clase ? " " + clase : "")}>
            <svg
              viewBox={"0 0 " + ancho + " " + alto}
              shapeRendering="crispEdges"
              role={etiqueta ? "img" : undefined}
              aria-label={etiqueta || undefined}
              aria-hidden={etiqueta ? undefined : "true"}
              focusable="false"
            >
              {filas.map((fila, y) => {
                const rectangulos = [];
                let x = 0;
                while (x < fila.length) {
                  const caracter = fila[x];
                  let fin = x;
                  while (fin < fila.length && fila[fin] === caracter) {
                    fin += 1;
                  }
                  if (caracter !== "." && dibujo.paleta[caracter]) {
                    rectangulos.push(
                      <rect
                        key={y + "-" + x}
                        x={x}
                        y={y}
                        width={fin - x}
                        height={1}
                        fill={dibujo.paleta[caracter]}
                      />
                    );
                  }
                  x = fin;
                }
                return rectangulos;
              })}
            </svg>
          </span>
        );
      }

        let ultima = null;
        for (let intento = 0; intento < 30; intento += 1) {

          const pregunta = generador();
          if (pregunta) {
            ultima = pregunta;
            if (!usadas[pregunta.clave]) {
              return pregunta;

          }
        }
        return ultima;

      function GuardianesRealesInteractivo({ configuracion, alPreparar }) {
        const [pantalla, setPantalla] = React.useState("portada");
        const [modo, setModo] = React.useState("individual");
        const [sonido, setSonido] = React.useState(true);
        const [derrotados, setDerrotados] = React.useState([]);
        const [vidas, setVidas] = React.useState(3);
        const [puntos, setPuntos] = React.useState(0);
        const [racha, setRacha] = React.useState(0);
        const [mejorRacha, setMejorRacha] = React.useState(0);
        const [aciertos, setAciertos] = React.useState(0);
        const [fallos, setFallos] = React.useState(0);
        const [marcador, setMarcador] = React.useState([0, 0]);
        const [turno, setTurno] = React.useState(0);
        const [combate, setCombate] = React.useState(null);
        const [record, setRecord] = React.useState(null);
        const [recordNuevo, setRecordNuevo] = React.useState(false);
        const [huboReintento, setHuboReintento] = React.useState(false);
        const [salto, setSalto] = React.useState(180);
        const [heroeGolpeado, setHeroeGolpeado] = React.useState(false);
        const arenaRef = React.useRef(null);
        const heroeRef = React.useRef(null);
        const rivalRef = React.useRef(null);
        const temporizador = React.useRef(null);
        const continuarRef = React.useRef(null);

        React.useEffect(() => {
          if (window.katex) {
            alPreparar();
          }
        }, [alPreparar]);

        React.useEffect(() => {
          try {
            const guardado = window.localStorage.getItem("gr-record-guardianes");
            if (guardado) {
              setRecord(JSON.parse(guardado));
            }
          } catch (error) {
            // Sin almacenamiento disponible: el récord simplemente no persiste.
          }
          return () => {
            if (temporizador.current) {
              window.clearTimeout(temporizador.current);
            }
          };
        }, []);

        // Distancia real entre los dos luchadores: el salto la usa para
        // aterrizar justo encima del guardián sea cual sea el ancho.
        React.useLayoutEffect(() => {
          const medir = () => {
            if (!heroeRef.current || !rivalRef.current) {
              return;
            }
            const desdeHeroe = heroeRef.current.getBoundingClientRect();
            const hastaRival = rivalRef.current.getBoundingClientRect();
            const distancia = Math.round(
              hastaRival.left +
                hastaRival.width / 2 -
                (desdeHeroe.left + desdeHeroe.width / 2)
            );
            setSalto((anterior) =>
              Math.abs(anterior - distancia) < 2 ? anterior : distancia
            );
          };
          medir();
          window.addEventListener("resize", medir);
          return () => window.removeEventListener("resize", medir);
        });

        // Al responder, los botones de opción se deshabilitan y el foco del
        // teclado se quedaría huérfano: pasa al botón de continuar.
        const hayRespuesta = combate !== null && combate.respuesta !== null;
        React.useEffect(() => {
          if (!hayRespuesta || !continuarRef.current) {
            return;
          }
          const activo = document.activeElement;
          if (!activo || activo === document.body || activo.disabled) {
            continuarRef.current.focus();
          }
        }, [hayRespuesta]);

        // Una partida con reintentos no compite por el récord: si contase,
        // bastaría con reintentar sin fin para acumular puntos.
        const esFinalConRecord =
          pantalla === "final" && modo === "individual" && !huboReintento;
        React.useEffect(() => {
          if (!esFinalConRecord) {
            return;
          }
          if (record && record.puntos >= puntos) {
            return;
          }
          const nuevo = {
            puntos,
            fecha: new Date().toLocaleDateString("es-ES")
          };
          setRecord(nuevo);
          setRecordNuevo(true);
          try {
            window.localStorage.setItem(
              "gr-record-guardianes",
              JSON.stringify(nuevo)
            );
          } catch (error) {
            // Igual que arriba: sin persistencia no pasa nada grave.
          }
        }, [esFinalConRecord]);

        if (!window.katex) {
          return null;
        }

        const indiceSiguiente = derrotados.length;
        const nombresEquipo = ["Equipo azul", "Equipo rojo"];

        const empezarPartida = (modoElegido) => {
          setModo(modoElegido);
          setDerrotados([]);
          setVidas(3);
          setPuntos(0);
          setRacha(0);
          setMejorRacha(0);
          setAciertos(0);
          setFallos(0);
          setMarcador([0, 0]);
          setTurno(0);
          setCombate(null);
          setRecordNuevo(false);
          setHeroeGolpeado(false);
          setHuboReintento(false);
          setPantalla("mapa");
          grSonar("paso", sonido);
        };

        const abrirCombate = (indice) => {
          const usadas = {};
          const pregunta = grNuevaPregunta(indice, usadas);
          if (!pregunta) {
            return;
          }
          usadas[pregunta.clave] = true;
          setCombate({
            indice,
            vidaRival: indice === 6 ? 5 : 3,
            vidaTotal: indice === 6 ? 5 : 3,
            pregunta,
            respuesta: null,
            usadas,
            animacion: null
          });
          setPantalla("combate");
          grSonar(indice === 6 ? "jefe" : "paso", sonido);
        };

        const responder = (indiceOpcion) => {
          if (!combate || combate.respuesta !== null) {
            return;
          }
          const opcion = combate.pregunta.opciones[indiceOpcion];
          if (opcion.esCorrecta) {
            const nuevaRacha = racha + 1;
            setRacha(nuevaRacha);
            setMejorRacha(Math.max(mejorRacha, nuevaRacha));
            setAciertos(aciertos + 1);
            if (modo === "individual") {
              const ganancia =
                Math.min(100 + 25 * (nuevaRacha - 1), 200) *
                (combate.indice === 6 ? 2 : 1);
              setPuntos(puntos + ganancia);
            } else {
              setMarcador(
                turno === 0
                  ? [marcador[0] + 1, marcador[1]]
                  : [marcador[0], marcador[1] + 1]
              );
            }
            const vidaNueva = combate.vidaRival - 1;
            grSonar(vidaNueva === 0 ? "victoria" : "acierto", sonido);
            setCombate({
              ...combate,
              respuesta: indiceOpcion,
              vidaRival: vidaNueva,
              animacion: vidaNueva === 0 ? "remate" : "salto"
            });
          } else {
            grSonar("fallo", sonido);
            setRacha(0);
            setFallos(fallos + 1);
            if (modo === "individual") {
              setVidas(vidas - 1);
            }
            setCombate({
              ...combate,
              respuesta: indiceOpcion,
              animacion: "contraataque"
            });
            // El personaje solo se queda con cara de mareo cuando el
            // proyectil del guardián llega hasta él.
            if (temporizador.current) {
              window.clearTimeout(temporizador.current);
            }
            temporizador.current = window.setTimeout(() => {
              setHeroeGolpeado(true);
            }, 460);
          }
        };

        const continuar = () => {
          if (!combate) {
            return;
          }
          setHeroeGolpeado(false);
          if (temporizador.current) {
            window.clearTimeout(temporizador.current);
            temporizador.current = null;
          }
          if (combate.vidaRival === 0) {
            const nuevos = derrotados.concat(combate.indice);
            setDerrotados(nuevos);
            setCombate(null);
            // El turno también cambia al cerrar el combate: si no, el equipo
            // que asesta el golpe final abriría el siguiente guardián.
            if (modo === "equipos") {
              setTurno(1 - turno);
            }
            setPantalla(combate.indice === 6 ? "final" : "mapa");
            return;
          }
          if (modo === "individual" && vidas === 0) {
            grSonar("derrota", sonido);
            setPantalla("derrota");
            return;
          }
          const pregunta = grNuevaPregunta(combate.indice, combate.usadas);
          if (!pregunta) {
            return;
          }
          combate.usadas[pregunta.clave] = true;
          if (modo === "equipos") {
            setTurno(1 - turno);
          }
          setCombate({
            ...combate,
            pregunta,
            respuesta: null,
            animacion: null
          });
        };

        const reintentar = () => {
          setVidas(3);
          setRacha(0);
          setHuboReintento(true);
          abrirCombate(combate ? combate.indice : indiceSiguiente);
        };

        const botonSonido = (
          <button
            type="button"
            className="gr-boton es-secundario"
            onClick={() => setSonido(!sonido)}
          >
            {sonido ? "Sonido: sí" : "Sonido: no"}
          </button>
        );

        const rivalDatos = (indice) =>
          indice === 6 ? GR_JEFE : GR_GUARDIANES[indice];

        const saltando =
          combate !== null &&
          (combate.animacion === "salto" || combate.animacion === "remate");

        let contenido = null;

        if (pantalla === "portada") {
          contenido = (
            <div className="gr-pantalla">
              <p className="gr-rotulo">Los Guardianes de ℝ</p>
              <p className="gr-subrotulo">
                Seis guardianes custodian la unidad. Derrota a los seis,
                planta cara a Áleph y conviértete en Maestro de los Reales.
              </p>
              <div className="gr-mapa" aria-hidden="true">
                {GR_GUARDIANES.map((guardian) => (
                  <div key={guardian.clave} style={{ width: "3.4rem" }}>
                    <GrSprite dibujo={GR_SPRITES[guardian.clave]} etiqueta="" />
                  </div>
                ))}
              </div>
              <div className="gr-botonera">
                <button
                  type="button"
                  className="gr-boton es-principal"
                  onClick={() => empezarPartida("individual")}
                >
                  Un jugador
                </button>
                <button
                  type="button"
                  className="gr-boton es-principal"
                  onClick={() => empezarPartida("equipos")}
                >
                  Duelo por equipos
                </button>
                {botonSonido}
              </div>
              <p className="gr-nota-pie">
                Cada respuesta correcta es un golpe: tres derriban a un
                guardián y cinco al jefe. En modo individual tienes tres
                vidas y cada acierto encadenado vale más puntos; por equipos,
                los turnos se alternan y gana quien asesta más golpes.
                {record
                  ? " Récord local: " + record.puntos + " puntos (" + record.fecha + ")."
                  : ""}
              </p>
            </div>
          );
        } else if (pantalla === "mapa") {
          contenido = (
            <div className="gr-pantalla">
              <p className="gr-rotulo">Mapa de la unidad</p>
              {modo === "individual" ? (
                <div className="gr-marcadores">
                  <span>
                    Vidas:{" "}
                    <GrCorazones total={3} vivos={vidas} etiqueta={"Te quedan " + vidas + " vidas de 3"} />
                  </span>
                  <span>
                    Puntos: <strong>{puntos}</strong>
                  </span>
                  <span>
                    Racha: <strong>{racha}</strong>
                  </span>
                </div>
              ) : (
                <div className="gr-equipos">
                  {nombresEquipo.map((nombre, indice) => (
                    <span
                      key={nombre}
                      className={
                        "gr-equipo " +
                        (indice === 0 ? "es-azul" : "es-rojo") +
                        (turno === indice ? " tiene-turno" : "")
                      }
                    >
                      {nombre}: {marcador[indice]}
                    </span>
                  ))}
                </div>
              )}
              <div className="gr-mapa">
                {GR_GUARDIANES.map((guardian, indice) => {
                  const derrotado = derrotados.indexOf(indice) !== -1;
                  const actual = indice === indiceSiguiente;
                  return (
                    <button
                      key={guardian.clave}
                      type="button"
                      className={
                        "gr-nodo" +
                        (derrotado ? " es-derrotado" : "") +
                        (actual ? " es-actual" : "") +
                        (!derrotado && !actual ? " es-bloqueado" : "")
                      }
                      disabled={!actual}
                      onClick={() => abrirCombate(indice)}
                      aria-label={
                        guardian.nombre +
                        " (" +
                        guardian.apartado +
                        "): " +
                        (derrotado
                          ? "derrotado"
                          : actual
                            ? "combate disponible"
                            : "todavía bloqueado")
                      }
                    >
                      <span className="gr-nodo-numero">
                        {derrotado ? <span className="gr-medalla">★ VENCIDO</span> : "GUARDIÁN " + (indice + 1)}
                      </span>
                      <GrSprite dibujo={GR_SPRITES[guardian.clave]} etiqueta="" />
                      <span>{guardian.nombre}</span>
                      <span className="gr-nodo-numero">{guardian.apartado}</span>
                    </button>
                  );
                })}
                <button
                  type="button"
                  className={
                    "gr-nodo" +
                    (derrotados.indexOf(6) !== -1
                      ? " es-derrotado"
                      : indiceSiguiente === 6
                        ? " es-actual"
                        : " es-bloqueado")
                  }
                  disabled={indiceSiguiente !== 6}
                  onClick={() => abrirCombate(6)}
                  aria-label={
                    GR_JEFE.nombre +
                    ": " +
                    (indiceSiguiente === 6
                      ? "combate final disponible"
                      : "se desbloquea al vencer a los seis guardianes")
                  }
                >
                  <span className="gr-nodo-numero">JEFE FINAL</span>
                  <GrSprite dibujo={GR_SPRITES.jefe} etiqueta="" />
                  <span>Áleph</span>
                  <span className="gr-nodo-numero">Señor del Continuo</span>
                </button>
              </div>
              <div className="gr-botonera">
                {botonSonido}
                <button
                  type="button"
                  className="gr-boton es-secundario"
                  onClick={() => setPantalla("portada")}
                >
                  Abandonar partida
                </button>
              </div>
            </div>
          );
        } else if (pantalla === "combate" && combate) {
          const rival = rivalDatos(combate.indice);
          const esJefe = combate.indice === 6;
          const respondida = combate.respuesta !== null;
          const opcionElegida = respondida
            ? combate.pregunta.opciones[combate.respuesta]
            : null;
          contenido = (
            <div className="gr-pantalla">
              <p className="gr-rotulo">{rival.nombre}</p>
              <p className="gr-subrotulo">
                {rival.apartado} — «{rival.grito}»
              </p>
              {modo === "individual" ? (
                <div className="gr-marcadores">
                  <span>
                    Vidas:{" "}
                    <GrCorazones total={3} vivos={vidas} etiqueta={"Te quedan " + vidas + " vidas de 3"} />
                  </span>
                  <span>
                    Rival:{" "}
                    <GrCorazones
                      total={combate.vidaTotal}
                      vivos={combate.vidaRival}
                      etiqueta={"Al rival le quedan " + combate.vidaRival + " corazones de " + combate.vidaTotal}
                    />
                  </span>
                  <span>
                    Puntos: <strong>{puntos}</strong>
                  </span>
                  <span>
                    Racha: <strong>{racha}</strong>
                  </span>
                </div>
              ) : (
                <div>
                  <div className="gr-equipos">
                    {nombresEquipo.map((nombre, indice) => (
                      <span
                        key={nombre}
                        className={
                          "gr-equipo " +
                          (indice === 0 ? "es-azul" : "es-rojo") +
                          (turno === indice ? " tiene-turno" : "")
                        }
                      >
                        {nombre}: {marcador[indice]}
                      </span>
                    ))}
                  </div>
                  <div className="gr-marcadores">
                    <span>
                      Responde el <strong>{nombresEquipo[turno].toLowerCase()}</strong>
                    </span>
                    <span>
                      Rival:{" "}
                      <GrCorazones
                        total={combate.vidaTotal}
                        vivos={combate.vidaRival}
                        etiqueta={"Al rival le quedan " + combate.vidaRival + " corazones de " + combate.vidaTotal}
                      />
                    </span>
                  </div>
                </div>
              )}
              <div
                className="gr-arena"
                ref={arenaRef}
                style={{ "--gr-salto": salto + "px" }}
              >
                <div
                  className={
                    "gr-luchador gr-heroe" +
                    (saltando ? " esta-saltando" : "") +
                    (combate.animacion === "contraataque" ? " esta-golpeado" : "")
                  }
                  ref={heroeRef}
                >
                  <GrSprite
                    dibujo={
                      heroeGolpeado
                        ? GR_SPRITES.heroeAturdido
                        : saltando
                          ? GR_SPRITES.heroeSalto
                          : GR_SPRITES.heroe
                    }
                    etiqueta="Tu personaje"
                  />
                  <span className="gr-nombre-luchador">
                    {modo === "equipos" ? nombresEquipo[turno] : "Tú"}
                  </span>
                </div>
                <div
                  className={
                    "gr-luchador gr-rival" +
                    (esJefe ? " es-jefe" : "") +
                    (combate.animacion === "salto" ? " esta-aplastado" : "") +
                    (combate.animacion === "remate" ? " esta-cayendo" : "") +
                    (combate.animacion === "contraataque" ? " esta-cargando" : "")
                  }
                  ref={rivalRef}
                >
                  <GrSprite dibujo={GR_SPRITES[rival.clave]} etiqueta={rival.nombre} />
                  <span className="gr-nombre-luchador">{rival.nombre}</span>
                  {combate.animacion === "contraataque" && (
                    <span className="gr-proyectil" aria-hidden="true">
                      <GrProyectil simbolo={rival.simbolo} />
                    </span>
                  )}
                </div>
                {saltando && (
                  <span className="gr-onomatopeya es-golpe" aria-hidden="true">
                    {combate.animacion === "remate" ? "¡PUMBA!" : "¡BOING!"}
                  </span>
                )}
                {combate.animacion === "contraataque" && (
                  <span className="gr-onomatopeya es-daño" aria-hidden="true">
                    ¡ZAS!
                  </span>
                )}
              </div>
              <div className="gr-tarjeta-pregunta">
                {/* Región viva siempre montada: si apareciera junto con su
                    texto, los lectores de pantalla no lo anunciarían. */}
                <p className="gr-anuncio" aria-live="polite">
                  {respondida
                    ? (opcionElegida.esCorrecta ? "Correcto. " : "Incorrecto. ") +
                      combate.pregunta.explicacion
                        .map((parte) => parte.t || parte.m || "")
                        .join(" ")
                    : ""}
                </p>
                <p className="gr-enunciado">
                  <GrTextoConFormulas partes={combate.pregunta.enunciado} />
                </p>
                <div className="gr-opciones">
                  {combate.pregunta.opciones.map((opcion, indice) => (
                    <button
                      key={opcion.clave}
                      type="button"
                      className={
                        "gr-opcion" +
                        (respondida && opcion.esCorrecta ? " es-correcta" : "") +
                        (respondida && indice === combate.respuesta && !opcion.esCorrecta
                          ? " es-fallida"
                          : "") +
                        (respondida && indice !== combate.respuesta && !opcion.esCorrecta
                          ? " es-apagada"
                          : "")
                      }
                      disabled={respondida}
                      onClick={() => responder(indice)}
                    >
                      <GrTextoConFormulas
                        partes={
                          opcion.contenido.m !== undefined
                            ? [{ m: opcion.contenido.m }]
                            : [{ t: opcion.contenido.t }]
                        }
                      />
                    </button>
                  ))}
                </div>
                {respondida && (
                  <div
                    className={
                      "gr-veredicto" + (opcionElegida.esCorrecta ? "" : " es-fallo")
                    }
                  >
                    <strong>
                      {opcionElegida.esCorrecta
                        ? combate.vidaRival === 0
                          ? "¡Golpe definitivo!"
                          : "¡Impacto!"
                        : modo === "individual"
                          ? "¡Te ha golpeado! Pierdes una vida."
                          : "¡Fallo! No hay golpe."}
                    </strong>
                    <GrTextoConFormulas partes={combate.pregunta.explicacion} />
                  </div>
                )}
                {respondida && (
                  <div className="gr-botonera">
                    <button
                      type="button"
                      className="gr-boton es-principal"
                      ref={continuarRef}
                      onClick={continuar}
                    >
                      {combate.vidaRival === 0
                        ? esJefe
                          ? "Reclamar la victoria"
                          : "Volver al mapa"
                        : modo === "individual" && vidas === 0
                          ? "Ver el resultado"
                          : "Continuar"}
                    </button>
                  </div>
                )}
              </div>
            </div>
          );
        } else if (pantalla === "derrota") {
          contenido = (
            <div className="gr-pantalla">
              <p className="gr-rotulo">Fin de la partida</p>
              <p className="gr-subrotulo">
                Te has quedado sin vidas, pero los guardianes vencidos siguen
                vencidos: repasa la explicación de tus fallos y vuelve al
                combate.
              </p>
              <div className="gr-final-cifras">
                <span className="gr-cifra">
                  <strong>{puntos}</strong>
                  <span>puntos</span>
                </span>
                <span className="gr-cifra">
                  <strong>{aciertos}</strong>
                  <span>aciertos</span>
                </span>
                <span className="gr-cifra">
                  <strong>{fallos}</strong>
                  <span>fallos</span>
                </span>
              </div>
              <div className="gr-botonera">
                <button type="button" className="gr-boton es-principal" onClick={reintentar}>
                  Reintentar el combate
                </button>
                <button
                  type="button"
                  className="gr-boton es-secundario"
                  onClick={() => setPantalla("portada")}
                >
                  Volver a la portada
                </button>
              </div>
            </div>
          );
        } else if (pantalla === "final") {
          const ganador =
            marcador[0] === marcador[1] ? -1 : marcador[0] > marcador[1] ? 0 : 1;
          contenido = (
            <div className="gr-pantalla">
              <p className="gr-rotulo gr-parpadeo">¡Unidad superada!</p>
              <p className="gr-subrotulo">
                {modo === "individual"
                  ? "Has derrotado a los seis guardianes y al mismísimo Áleph: la recta real es tuya."
                  : ganador === -1
                    ? "¡Empate! Los dos equipos dominan la recta real por igual."
                    : "Victoria del " + nombresEquipo[ganador].toLowerCase() + ". La recta real tiene nuevos dueños."}
              </p>
              {modo === "individual" ? (
                <div className="gr-final-cifras">
                  <span className="gr-cifra">
                    <strong>{puntos}</strong>
                    <span>puntos</span>
                  </span>
                  <span className="gr-cifra">
                    <strong>{aciertos}</strong>
                    <span>aciertos</span>
                  </span>
                  <span className="gr-cifra">
                    <strong>{fallos}</strong>
                    <span>fallos</span>
                  </span>
                  <span className="gr-cifra">
                    <strong>{mejorRacha}</strong>
                    <span>mejor racha</span>
                  </span>
                </div>
              ) : (
                <div className="gr-final-cifras">
                  {nombresEquipo.map((nombre, indice) => (
                    <span key={nombre} className="gr-cifra">
                      <strong>{marcador[indice]}</strong>
                      <span>{nombre}</span>
                    </span>
                  ))}
                </div>
              )}
              {modo === "individual" && recordNuevo && (
                <p className="gr-subrotulo gr-parpadeo">¡Nuevo récord local!</p>
              )}
              <div className="gr-botonera">
                <button
                  type="button"
                  className="gr-boton es-principal"
                  onClick={() => setPantalla("portada")}
                >
                  Jugar otra vez
                </button>
                {botonSonido}
              </div>
            </div>
          );
        }

        return (
          <div className="componente-interactivo guardianes-juego">
            <p className="titulo-interactivo">
              {configuracion.titulo || "Los Guardianes de ℝ"}
            </p>
            <p className="instruccion-interactivo">
              Un torneo de repaso de toda la unidad: responde para golpear,
              lee la explicación cuando falles y llega hasta el jefe final.
            </p>
            {contenido}
          </div>
        );
      }

      const montaje = document.getElementById("guardianes-montaje");
      const preparado = () =>
        document.body.classList.add("juego-listo");
      const fallo = () =>
        document.body.classList.remove("juego-listo");

      try {
        ReactDOM.createRoot(montaje).render(
          <LimiteDeError alFallar={fallo}>
            <GuardianesRealesInteractivo
              configuracion={{}}
              alPreparar={preparado}
            />
          </LimiteDeError>
        );
      } catch (error) {
        console.error("No se pudo montar el juego:", error);
        fallo();
      }
    })();
  </script>
</body>
</html>
